plugin:
  name: custom-data-type-gvk
  version: 2.1
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-k10plus
  displayname:
    de-DE: k10plus-Verknüpfung
    en-US: k10plus-Referencing
  info:
    de-DE: |
      Ergänzt fylr um einen Feldtyp, mit dem sich Datensätze mit Titeln aus dem [k10plus-Verbundkatalog](https://kxp.k10plus.de/) verknüpfen lassen – der gemeinsamen Katalogisierungsdatenbank der Verbünde GBV und SWB. Redakteure durchsuchen den Katalog über den Suggest-Dienst des GBV direkt im Maskenfeld und speichern einen Verweis auf den gewählten Datensatz. Standardmäßig wird die k10plus-Webansicht abgefragt; die Zieldatenbank ist konfigurierbar, und ein nächtlicher Updater hält verknüpfte Einträge aktuell.
    en-US: |
      Adds a custom data type for linking records to titles in the [k10plus union catalogue](https://kxp.k10plus.de/), the shared cataloguing database of the GBV and SWB library networks. Editors search the catalogue from a mask field via the GBV suggest service and store a link to the selected record. By default it queries the k10plus web view, but the target database is configurable, and a nightly updater keeps linked entries in sync.
  l10n: l10n/customDataTypek10plus.csv
  webfrontend:
    url: customDataTypek10plus.js
    css: customDataTypek10plus.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  gvk:
    mapping:
      conceptName:
        type: string
      conceptURI:
        type: string
        skipTerms: true
      conceptSource:
        type: string
        skipTerms: true
      conceptAncestors:
        type: string
        skipTerms: true
      facetTerm:
        type: text_l10n
        skipTerms: true
    config:
      schema:
        - name: database
          parameters:
            value:
              type: text
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]
        - name: database_overwrite
          parameters:
            value:
              type: text

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/k10plusUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1
      interval_base_config: update_interval_k10plus.days

base_config:
  - name: update_k10plus
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 24
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 24
        position: 2
      default_language:
        type: text
        default: 'de'
        position: 3
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 4
